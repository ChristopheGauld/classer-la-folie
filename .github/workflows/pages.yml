name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v6
      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Générer les pages
        run: python scripts/build.py
      - name: Vérifier les liens et la structure
        run: python scripts/validate.py
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
